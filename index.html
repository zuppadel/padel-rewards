<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Padel Rewards</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  min-height: 100vh;

  color: #17352b;
  display: flex;
  align-items: center;
  justify-content: center;

.container {

img {

  margin-bottom: 18px;
}

h1 {
  margin: 0 0 10px;
  font-size: 26px;
}

p {
  color: #718078;
  line-height: 1.5;
  margin-bottom: 24px;
}

.button {
  display: block;
  width: 100%;
  padding: 16px;
  background: #17352b;
  color: white;
  text-decoration: none;
  border-radius: 12px;
  font-size: 17px;
  font-weight: bold;
}

.button:hover {
  background: #245441;
}

.note {
  margin-top: 18px;
  font-size: 13px;
  color: #718078;

<div class="container">

</div>
